[project]
name = "job-agent-workspace"
version = "0.1.0"
description = "Local conversational job research with versioned state and evidence"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "openai>=2,<3", "gradio>=6.29,<7", "python-dotenv>=1,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
setup = ["requests>=2.28,<3", "websocket-client>=1.6,<2"]
dev = ["pytest>=9,<10", "ruff>=0.16,<1"]

[project.scripts]
job-agent = "job_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
